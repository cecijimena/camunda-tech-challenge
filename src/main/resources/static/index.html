<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camunda Tech Challenge</title>
</head>
<body>
    <h1>Camunda Tech Challenge </h1>
    <label for="animal-select">Choose an animal:</label>
    <select id="animal-select">
        <option value="cat">Cat</option>
        <option value="dog">Dog</option>
        <option value="duck">Duck</option>
    </select>
    <label for="animal-count">Number of images:</label>
    <input type="number" id="animal-count" min="1" value="1">
    <button id="fetch-image">Fetch Image</button>
    <button id="view-last">View Last Image</button>
    <p id="message"></p>
    <img id="animal-image" src="" alt="Animal Image" style="display:none; max-width: 300px;">
    <script>
        document.getElementById('fetch-image').addEventListener('click', async () => { 
            const animal = document.getElementById('animal-select').value;   
            const count = document.getElementById('animal-count').value;
            const response = await fetch(`/api/pictures?animalType=${animal}&count=${count}`, { method:'POST'});

            if (!response.ok) {
                document.getElementById('message').textContent = `Error: ${data.error}`;
                return;
            }
            document.getElementById('message').textContent = `Fetched ${count} ${animal}(s). Click view last image`;
        }); 

        document.getElementById('view-last').addEventListener('click', async () => {
            const animal = document.getElementById('animal-select').value;
            const response = await fetch(`/api/pictures/${animal}/last`, { method:'GET'});
            if (!response.ok) {
                document.getElementById('message').textContent = `Error: ${data.error}`;
                return;
            }
            response.blob().then(blob => {
                const url = URL.createObjectURL(blob);
                document.getElementById('animal-image').src = url;
                document.getElementById('animal-image').style.display = 'block';
            });
        });
    </script>
</html>
